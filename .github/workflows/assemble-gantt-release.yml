name: Assemble static Gantt release

on:
  push:
    branches: [fix/initiatives-gantt-release]
    paths:
      - releases/gantt-0.10.1.json
      - scripts/build_release.py
      - tests/check_release.py

permissions:
  contents: write

concurrency:
  group: assemble-gantt-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
      - name: Assemble and verify public/index.html
        run: |
          python3 scripts/build_release.py
          python3 tests/check_release.py
      - name: Commit the verified deployment artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/index.html && test -f public/version.json && git ls-files --error-unmatch public/version.json >/dev/null 2>&1 && git diff --quiet -- public/version.json; then
            echo 'The deployment artifact is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/version.json
          git commit -m 'build: publish verified ClusterBoard 0.10.1 with initiative Gantt'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic $AUTH" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
