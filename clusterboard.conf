server {
    listen 80;
    listen [::]:80;
    server_name 176.123.167.199;
    location / {
        resolver 127.0.0.11 valid=30s;
        set $clusterboard_upstream clusterboard-web-1:80;
        proxy_pass http://$clusterboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
