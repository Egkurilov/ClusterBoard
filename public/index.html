/* TeamBuilder 0.2 — resizable workspace, persistent inspector, distinct team cards. */
:root { --rail-width:44px; --inspector-width:340px; --sidebar-width:192px; }
html,body { overflow:hidden; }
button:focus-visible, [role="button"]:focus-visible { outline:3px solid #7097f7; outline-offset:3px; }
.app { height:100vh; height:100dvh; min-height:0; grid-template-columns:var(--sidebar-width) minmax(0,1fr) var(--inspector-width); grid-template-rows:65px minmax(0,1fr); }
.app.inspector-collapsed { grid-template-columns:var(--sidebar-width) minmax(0,1fr) var(--rail-width); }
.left { overflow:hidden; }
.nav { min-height:0; overflow:auto; }
.left-bottom { flex-shrink:0; }
.topbar { grid-column:2/4; gap:12px; padding:0 18px; }
.search { width:min(290px,23vw); min-width:155px; }
.panel-toggle.is-active { color:#2d61ca; background:#edf3ff; border-color:#ccdcf7; }
.panel-toggle { flex-shrink:0; }
.versions button { padding:8px 11px; }
.workspace { overflow:auto; min-height:0; container-type:inline-size; }
.workspace-inner.structure-page { padding:20px 22px 12px; height:100%; min-height:0; display:flex; flex-direction:column; }
.page-heading { align-items:center; flex-wrap:wrap; margin-bottom:14px; row-gap:12px; flex-shrink:0; }
.page-heading h1 { font-size:26px; letter-spacing:-.85px; }
.statline { gap:6px; flex-wrap:nowrap; }
.stat { min-width:76px; padding:9px 10px; gap:7px; border-color:#e2e8f2; }
.stat b { font-size:17px; }
.stat span { color:#73859f; }
.crumb { color:#8291a7; }
.subtitle { color:#72849e; }
.notice { flex-shrink:0; margin-bottom:12px; }
.notice.info { color:#57739c; background:#f0f5ff; border-color:#e0e9fb; }
.toolbar { flex-shrink:0; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.toolbar-left,.toolbar-right { gap:6px; }
.toolbar .btn { min-height:32px; }
.board-viewport { min-height:220px; flex:1; border-radius:15px; border-color:#dde5f0; background:radial-gradient(#d8e0ec .75px,transparent .75px) 0 0/20px 20px,#f6f8fc; box-shadow:inset 0 1px 5px #1b3a6410; overscroll-behavior:contain; }
.board-frame { position:relative; margin:0 auto; }
.board-content { padding:22px 22px 28px; width:max-content; min-width:0; position:absolute; top:0; left:0; transform-origin:top left; }
.root-pos { margin-bottom:30px; }
.root-card { min-width:270px; padding:11px 14px; border-color:#ccd9ec; box-shadow:0 3px 10px #3558870c; }
.root-card .root-info b { font-size:13px; }
.root-card .root-info small { color:#74849d; font-size:11px; }
.root-tag { font-size:9px; letter-spacing:.65px; padding:5px 7px; color:#577095; background:#eff4fb; }
.streams { gap:20px; align-items:stretch; }

function c9Date(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function c9DayDiff(a,b){return Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000);}

function c9Fmt(s,year){if(!s)return 'Не указан';return new Date(s.length===10?s+'T12:00:00':s).toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:year?'numeric':undefined});}

function c9Normalize(d){if(d.initiatives===undefined)d.initiatives=[];if(!Array.isArray(d.initiatives))throw Error('Инициативы: неверный формат хранилища; исходные данные не изменены.');if(d.initiativeSettings!==undefined&&(typeof d.initiativeSettings!=='object'||!d.initiativeSettings||Array.isArray(d.initiativeSettings)))throw Error('Неверные настройки инициатив.');if(!d.initiativeSettings)d.initiativeSettings={staleDays:7};if(![7,14,30].includes(d.initiativeSettings.staleDays))d.initiativeSettings.staleDays=7;return d;}
function c9ValidateRecord(x,strict){
 if(x&&x.startDate===undefined)x.startDate='';
 if(x&&(typeof x.startDate!=='string'||!c9ValidDate(x.startDate)))throw Error('Неверная дата начала.');
 if(x&&x.startDate&&x.deadline&&x.startDate>x.deadline)throw Error('Дата начала не может быть позже срока реализации.');
 if(!x||typeof x.id!=='string'||!x.id||typeof x.title!=='string'||!x.title.trim()||x.title.length>240)throw Error('Неверная инициатива: идентификатор или название.');
 if(typeof x.code!=='string'||x.code.length>40||typeof x.archived!=='boolean'||typeof x.demo!=='boolean')throw Error('Неверные служебные поля инициативы.');
 if(!C9_STATUS[x.status]||!C9_PRIORITY[x.priority]||!C9_HEALTH[x.health])throw Error('Неизвестный статус, приоритет или состояние инициативы.');
 for(const k of ['customer','statusText','description','nextStep','blocker','decisionNeeded'])if(typeof x[k]!=='string'||x[k].length>12000)throw Error('Неверное поле инициативы: '+k);
 if(!Array.isArray(x.systems)||x.systems.length>50||x.systems.some(s=>typeof s!=='string'||s.length>160))throw Error('Неверный список дорабатываемых систем.');
 for(const k of ['deadline','baselineDeadline','nextStepDate'])if(typeof x[k]!=='string'||!c9ValidDate(x[k]))throw Error('Неверная дата инициативы: '+k);
 if(x.itOwnerId!==null&&typeof x.itOwnerId!=='string')throw Error('Неверный ответственный за инициативу.');
 if(x.streamId!==null&&typeof x.streamId!=='string')throw Error('Неверный стрим инициативы.');
 if(!Number.isFinite(x.progress)||x.progress<0||x.progress>100)throw Error('Прогресс должен быть от 0 до 100.');
 if(!Array.isArray(x.events)||x.events.length>1000)throw Error('Неверная история инициативы.');
 for(const event of x.events)if(!event||typeof event.at!=='string'||typeof event.note!=='string'||!Array.isArray(event.changes)||event.changes.some(t=>typeof t!=='string'))throw Error('Неверная запись истории инициативы.');
 for(const k of ['createdAt','updatedAt','statusUpdatedAt'])if(typeof x[k]!=='string'||isNaN(Date.parse(x[k])))throw Error('Неверное время обновления инициативы.');
 if(strict&&x.status!=='draft'&&x.status!=='cancelled'){
  if(!x.itOwnerId||!data.people.some(p=>p.id===x.itOwnerId))throw Error('Выбери ответственного от ИТ. Без него инициативу можно сохранить только как черновик.');
  if(!x.customer.trim())throw Error('Укажи заказчика инициативы.');
  if(!x.deadline)throw Error('Укажи срок реализации.');
  if(!x.statusText.trim())throw Error('Добавь краткий текущий статус — что уже сделано и что происходит сейчас.');
 }
 if(strict&&x.status==='blocked'&&!x.blocker.trim())throw Error('Для заблокированной инициативы опиши блокер.');
 if(strict&&x.status==='done'&&x.progress!==100)throw Error('Для завершения установи прогресс 100% и опиши итог в текущем статусе.');
 return x;
}

function c9TableRow(x){return `<tr data-initiative="${esc(x.id)}"><td><input type="checkbox" data-c9-select="${esc(x.id)}" aria-label="Включить ${esc(x.title)} в презентацию" ${c9.selected.has(x.id)?'checked':''}></td><td class="c9-titlecell"><button class="c9-titlebutton" data-c9="open" data-id="${esc(x.id)}">${esc(x.title)}</button><div class="c9-subrow">${c9Priority(x)}<span class="c9-code">${esc(x.code)}</span>${x.demo?'<span class="c9-pill demo">ДЕМО</span>':''}</div><div class="c9-updated">${esc(c9Stream(x.streamId))}</div></td><td>${esc(x.customer||'Не указан')}</td><td>${c9Owner(x)}</td><td>${c9Stage(x)}<div class="c9-status-copy" title="${esc(x.statusText)}">${esc(x.statusText||'Ожидается первое обновление')}</div><div class="c9-updated">Обновлено ${c9Fmt(x.statusUpdatedAt)} · ${x.progress}%</div><div class="c9-progress"><i style="width:${x.progress}%"></i></div></td><td>${c9Due(x)}${c9Flags(x).filter(f=>f.label!=='Просрочена').slice(0,1).map(f=>`<span style="margin-top:6px" class="c9-pill ${f.type}">${f.label}</span>`).join('')}</td><td>${c9Systems(x,2)}</td><td><button class="c9-mini-btn" data-c9="update" data-id="${esc(x.id)}" aria-label="Обновить статус: ${esc(x.title)}" title="Обновить статус">${ico('edit',13)}</button></td></tr>`;}
function c9Card(x,board){return `<article class="c9-card" data-initiative="${esc(x.id)}"><div class="c9-card-head">${c9Priority(x)}<span class="c9-code">${esc(x.code)}${x.demo?' · ДЕМО':''}</span></div><h3><button data-c9="open" data-id="${esc(x.id)}">${esc(x.title)}</button></h3><div class="c9-subrow">${c9Stage(x)}${c9Flags(x).slice(0,2).map(f=>`<span class="c9-pill ${f.type}">${f.label}</span>`).join('')}</div><p>${esc(x.statusText||'Текущий статус ещё не описан')}</p>${!board?`<dl><dt>Заказчик</dt><dd>${esc(x.customer||'Не указан')}</dd><dt>От ИТ</dt><dd>${esc(c9Person(x.itOwnerId))}</dd><dt>Системы</dt><dd>${c9Systems(x,3)}</dd></dl>`:c9Systems(x,2)}<div class="c9-card-foot">${board?c9Owner(x):`<span class="c9-muted">Прогресс ${x.progress}%</span>`}<div>${c9Due(x)}</div></div><div class="c9-actions"><button class="btn" data-c9="update" data-id="${esc(x.id)}">${ico('edit',13)} Обновить статус</button>${!board?`<label style="display:flex;gap:7px;align-items:center;font-size:11px;color:#8b97a5"><input type="checkbox" data-c9-select="${esc(x.id)}" ${c9.selected.has(x.id)?'checked':''}>На встречу</label>`:''}</div></article>`;}
function c9Results(){const a=c9Filtered(),demo=data.initiatives.filter(x=>x.demo).length;if(!data.initiatives.length)return `<div class="c9-empty">${ico('briefcase',40)}<h2>Важные инициативы — в одном месте</h2><p>Создай первую инициативу или открой демонстрационный реестр. Люди, продукты и цели останутся без изменений.</p><div class="c9-actions"><button class="btn c9-accent" data-c9="new">${ico('plus',14)} Создать инициативу</button><button class="btn" data-c9="demo">Посмотреть на примере</button></div></div>`;return `${demo?`<div class="c9-demo-note"><span>В реестре ${demo} демонстрационных инициатив. Они помечены «ДЕМО» и не являются реальным планом.</span><button class="c9-link" data-c9="remove-demo">Убрать демопримеры</button></div>`:''}<div class="c9-list-tools"><span>Показано <b>${a.length}</b> из ${data.initiatives.filter(x=>!!x.archived===(c9.page==='archive')).length} · ${c9.page==='archive'?'Архив':c9.metric==='active'?'Активные':c9.metric==='all'?'Все состояния':({'attention':'Требуют внимания',upcoming:'Срок в ближайшие 14 дней',stale:'Без свежего статуса',owner:'Без ответственного'})[c9.metric]||'Все состояния'}</span><div class="c9-selection"><span id="c9-selection-count">${c9.selected.size?'На встречу: '+c9.selected.size:''}</span>${c9.selected.size?'<button class="c9-link" data-c9="unselect">Снять выбор</button>':''}<button class="btn small" data-c9="csv">${ico('download',12)} CSV</button></div></div>${!a.length?'<div class="c9-empty"><h2>В этом срезе инициатив нет</h2><p>Измени фильтры или добавь новую запись.</p><button class="btn" data-c9="reset">Сбросить фильтры</button></div>':c9.page==='board'?c9Board(a):`<div class="c9-table-wrap" role="region" tabindex="0" aria-label="Реестр инициатив с горизонтальной прокруткой"><table class="c9-table"><caption class="c9-sr">Инициативы: задача, заказчик, ответственный от ИТ, статус, срок и дорабатываемые системы</caption><colgroup><col style="width:3.5%"><col style="width:25%"><col style="width:11%"><col style="width:13%"><col style="width:21%"><col style="width:11.5%"><col style="width:11%"><col style="width:4%"></colgroup><thead><tr><th scope="col"><input type="checkbox" id="c9-select-all" aria-label="Выбрать все показанные инициативы" ${a.every(x=>c9.selected.has(x.id))?'checked':''}></th><th scope="col">Задача / приоритет</th><th scope="col">Заказчик</th><th scope="col">Ответственный ИТ</th><th scope="col">Текущий статус</th><th scope="col">Срок реализации</th><th scope="col">Системы</th><th scope="col"><span class="c9-sr">Действия</span></th></tr></thead><tbody>${a.map(c9TableRow).join('')}</tbody></table></div><div class="c9-mobile-list">${a.map(x=>c9Card(x,false)).join('')}</div>`}<p class="c9-meta-note">Риски и просрочка определяются отдельно от этапа работы. Счётчики отражают текущий срез. Число инициатив не равно загрузке сотрудников.</p>`;}
function c9Board(rows){const keys=['draft','planned','in_progress','blocked','paused','done','cancelled'].filter(k=>rows.some(x=>x.status===k)||!['done','cancelled'].includes(k));return `<div class="c9-board-wrap" role="region" aria-label="Доска инициатив" tabindex="0"><div class="c9-board" style="grid-template-columns:repeat(${keys.length},275px)">${keys.map(k=>{const a=rows.filter(x=>x.status===k);return `<section class="c9-lane"><h3>${C9_STATUS[k]} <small>${a.length}</small></h3>${a.map(x=>c9Card(x,true)).join('')||'<div class="c9-lane-empty">Нет инициатив</div>'}</section>`;}).join('')}</div></div>`;}
function c9Refresh(){const el=$('#c9-results');if(el)el.innerHTML=c9Results();const ms=$('#c9-metrics');if(ms)ms.innerHTML=c9Metrics();if(isMobile()){const b=$('.c9-board');if(b)b.style.gridTemplateColumns='minmax(0,1fr)';}}
render=function(){c9Normalize(data);if(ui.view==='initiatives'){v5.module='initiatives';document.body.dataset.workspace='initiatives';syncRoute5();if(c9.presentation)$('#app').innerHTML=c9PresentationHTML();else{const top=$('#c9-workspace')?$('#c9-workspace').scrollTop:0;$('#app').innerHTML=c9Shell();if($('#c9-workspace'))$('#c9-workspace').scrollTop=top;if(isMobile()&&$('.c9-board'))$('.c9-board').style.gridTemplateColumns='minmax(0,1fr)';}document.title='ClusterBoard 0.10.1 · Инициативы';if(c9.drawer)c9PaintDrawer();}else{c9RenderBase();document.title='ClusterBoard 0.10.1 · '+(v5.module==='goals'?'Цели квартала':'Люди и команды');}document.querySelectorAll('.portal-version-tag,.v5-phone-brand small').forEach(n=>n.textContent=n.textContent.replace(/v0\.[6789](?:\.\d+)?/g,'v0.10.1'));window.CBRecovery.showStorage();};
function c9NewRecord(){const at=new Date().toISOString(),n=data.initiatives.reduce((m,x)=>Math.max(m,Number((x.code||'').replace(/\D/g,''))||0),0)+1;return {id:'ini_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8),code:'ИН-'+String(n).padStart(3,'0'),title:'',priority:'P2',customer:'',itOwnerId:null,status:'draft',health:'on_track',statusText:'',description:'',startDate:'',deadline:'',baselineDeadline:'',systems:[],streamId:null,progress:0,nextStep:'',nextStepDate:'',blocker:'',decisionNeeded:'',createdAt:at,updatedAt:at,statusUpdatedAt:at,archived:false,demo:false,events:[]};}
function c9Open(id,mode){if(!c9Discard())return;const x=id?c9ById(id):c9NewRecord();if(!x)return;c9.lastFocus=document.activeElement;c9.drawer={id:id||null,mode:mode||'view',draft:clone(x),comment:'',error:'',revision:id?x.updatedAt:null};c9.dirty=false;c9PaintDrawer();}
function c9CloseDrawer(force){if(!force&&c9.dirty&&!confirm('Закрыть без сохранения изменений инициативы?'))return false;const old=document.getElementById('c9-overlay');if(old)old.remove();const app=document.getElementById('app');if(app){app.inert=false;app.removeAttribute('aria-hidden');}c9.drawer=null;c9.dirty=false;if(c9.lastFocus&&c9.lastFocus.isConnected){try{c9.lastFocus.focus();}catch(_e){}}return true;}
function c9SetDrawerMode(mode){if(!c9.drawer)return;c9.drawer.mode=mode;c9PaintDrawer();}
function c9Field(key,label,type,opts){const d=c9.drawer.draft,o=opts||{},value=d[key]===null?'':d[key],id='c9f-'+key;let body;if(type==='textarea')body=`<textarea id="${id}" data-c9-field="${key}" maxlength="${o.max||4000}" rows="${o.rows||3}" placeholder="${esc(o.placeholder||'')}">${esc(value)}</textarea>`;else if(type==='select')body=`<select id="${id}" data-c9-field="${key}">${c9Opt(o.options||{},String(value))}</select>`;else body=`<input id="${id}" data-c9-field="${key}" type="${type||'text'}" value="${esc(key==='systems'?value.join(', '):value)}" ${type==='number'?'min="0" max="100" step="1"':''} ${type==='text'||!type?'maxlength="'+(o.max||240)+'"':''} ${o.list?'list="'+o.list+'"':''} placeholder="${esc(o.placeholder||'')}">`;return `<label class="c9-field ${o.wide?'wide':''} ${o.mobileWide?'mobile-wide':''}" for="${id}">${label}${body}${o.hint?`<small>${o.hint}</small>`:''}</label>`;}
function c9EditForm(quick){const x=c9.drawer.draft,people=Object.assign({'':'Не назначен · только черновик'},Object.fromEntries(data.people.map(p=>[p.id,p.name]))),streams=Object.assign({'':'Уровень кластера'},Object.fromEntries(data.current.streams.map(s=>[s.id,s.name])));return `<div class="c9-fields">${!quick?`${c9Field('title','Задача *','text',{wide:true,max:240,placeholder:'Какой результат должен быть получен?'})}${c9Field('priority','Приоритет','select',{options:Object.fromEntries(Object.entries(C9_PRIORITY).map(([k,v])=>[k,k+' · '+v]))})}${c9Field('streamId','Стрим','select',{options:streams})}${c9Field('customer','Заказчик','text',{placeholder:'ФИО или подразделение',list:'c9-customers',mobileWide:true})}${c9Field('itOwnerId','Ответственный от ИТ','select',{options:people,mobileWide:true,hint:'Один владелец результата. Назначения в командах не меняются.'})}${c9Field('startDate','Дата начала · для Ганта','date',{hint:'Не заполняется датой создания автоматически.'})}${c9Field('deadline','Срок реализации','date')}${c9Field('systems','Дорабатываемые системы','text',{max:2000,hint:'Названия через запятую, точку с запятой или с новой строки.'})}<div class="c9-section-label">Ход реализации</div>`:''}${c9Field('status','Текущий статус','select',{options:C9_STATUS})}${c9Field('health','Риск выполнения','select',{options:C9_HEALTH})}${c9Field('statusText','Краткое обновление для руководителя','textarea',{wide:true,max:2000,placeholder:'Что сделано, что происходит сейчас, что мешает',hint:'Этот текст попадёт в реестр и презентацию.'})}${c9Field('progress','Прогресс, %','number',{hint:'Ручная оценка, не расчёт загрузки сотрудников.'})}${quick?c9Field('startDate','Дата начала · для Ганта','date')+c9Field('deadline','Срок реализации','date'):c9Field('nextStepDate','Дата следующего шага','date')}${c9Field('nextStep','Следующий шаг','textarea',{wide:true,max:2000,rows:2,placeholder:'Какое конкретное действие будет выполнено дальше?'})}${quick?c9Field('nextStepDate','Дата следующего шага','date',{wide:true}):''}${c9Field('blocker','Блокер / зависимость','textarea',{wide:true,max:2000,rows:2,placeholder:'Что не позволяет продолжить?'})}${c9Field('decisionNeeded','Какое решение требуется от руководства','textarea',{wide:true,max:2000,rows:2,placeholder:'Что нужно согласовать или решить? Можно оставить пустым.'})}${!quick?`<div class="c9-section-label">Подробности</div>${c9Field('description','Детальное описание','textarea',{wide:true,max:10000,rows:5,placeholder:'Контекст, ожидаемый эффект, границы работ и критерий завершения'})}`:''}<label class="c9-field wide">Комментарий к изменению<textarea id="c9f-comment" data-c9-comment maxlength="2000" rows="2" placeholder="Причина переноса срока или пояснение к обновлению">${esc(c9.drawer.comment)}</textarea><small>При изменении срока причина обязательна. История сохраняется локально.</small></label></div><datalist id="c9-customers">${Array.from(new Set(data.initiatives.map(x=>x.customer).filter(Boolean))).map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist>`;}
function c9Detail(x){return `<div class="c9-subrow">${c9Priority(x)}${c9Stage(x)}${x.demo?'<span class="c9-pill demo">ДЕМО</span>':''}</div><h3 class="c9-detail-title" style="margin-top:15px">${esc(x.title)}</h3><div class="c9-subrow">${c9Flags(x).map(f=>`<span class="c9-pill ${f.type}">${f.label}</span>`).join('')}</div><div class="c9-details"><div class="c9-detail-block"><small>Заказчик</small><b>${esc(x.customer||'Не указан')}</b></div><div class="c9-detail-block"><small>Ответственный от ИТ</small>${c9Owner(x)}</div><div class="c9-detail-block"><small>Срок реализации</small>${c9Due(x)}${x.baselineDeadline&&x.baselineDeadline!==x.deadline?`<div class="c9-date-meta">Первоначально: ${c9Fmt(x.baselineDeadline,true)}</div>`:''}</div><div class="c9-detail-block"><small>Стрим · прогресс</small><b>${esc(c9Stream(x.streamId))}</b><div class="c9-updated">${x.progress}% · ${esc(C9_HEALTH[x.health])}</div><div class="c9-progress"><i style="width:${x.progress}%"></i></div></div></div><section class="c9-detail-section"><h3>Текущий статус</h3><p>${esc(x.statusText||'Обновление пока не добавлено')}</p><div class="c9-updated">Проверен ${c9Fmt(x.statusUpdatedAt,true)}</div></section><section class="c9-detail-section"><h3>Следующий шаг ${x.nextStepDate?'· '+c9Fmt(x.nextStepDate,true):''}</h3><p>${esc(x.nextStep||'Не определён')}</p></section>${x.decisionNeeded?`<section class="c9-detail-section highlight"><h3>Нужно решение</h3><p>${esc(x.decisionNeeded)}</p></section>`:''}${x.blocker?`<section class="c9-detail-section"><h3>Блокер / зависимость</h3><p>${esc(x.blocker)}</p></section>`:''}<section class="c9-detail-section"><h3>Дорабатываемые системы</h3>${c9Systems(x)}</section><section class="c9-detail-section"><h3>Детальное описание</h3><p>${esc(x.description||'Описание не добавлено')}</p></section><details><summary>История изменений · ${x.events.length}</summary>${x.events.slice().reverse().map(e=>`<div class="c9-event"><b>${new Date(e.at).toLocaleString('ru-RU')} · локальная запись</b><div>${e.changes.map(esc).join('<br>')}</div>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`).join('')||'<p class="c9-muted">История пуста.</p>'}</details><div class="c9-meta-note">История хранится в браузере и не является защищённым журналом аудита.</div>`;}
function c9PaintDrawer(){if(!c9.drawer)return;const ctx=c9.drawer,x=ctx.draft,view=ctx.mode==='view',exists=!!ctx.id,old=document.getElementById('c9-overlay'),scroll=old&&old.querySelector('.c9-panel-body')?old.querySelector('.c9-panel-body').scrollTop:0;if(old)old.remove();const el=document.createElement('div');el.id='c9-overlay';el.className='c9-overlay';el.setAttribute('data-c9-backdrop','true');el.innerHTML=`<section class="c9-panel" role="dialog" aria-modal="true" aria-labelledby="c9-dialog-title"><header class="c9-panel-head"><div><div class="c9-eyebrow">ИНИЦИАТИВА / ${esc(x.code)}</div><h2 id="c9-dialog-title">${view?'Карточка инициативы':ctx.mode==='update'?'Обновить текущий статус':exists?'Редактировать инициативу':'Новая инициатива'}</h2><p>${view?'Владелец, срок и следующий шаг.':ctx.mode==='update'?esc(x.title):'Черновик можно сохранить без назначенного владельца.'}</p></div><button class="c9-close" data-c9="close" aria-label="Закрыть карточку">${ico('close',18)}</button></header><div class="c9-panel-body">${ctx.error?`<div class="c9-error" role="alert">${esc(ctx.error)}</div>`:''}${ctx.mode==='update'?'<button class="btn" style="width:100%;margin-bottom:20px" data-c9="confirm-current">✓ Статус актуален — подтвердить без изменений</button>':''}${view?c9Detail(x):`<form id="c9-form" novalidate>${c9EditForm(ctx.mode==='update')}</form>`}</div><footer class="c9-panel-footer">${view?`<div class="c9-actions"><button class="btn" data-c9="edit">${ico('edit',13)} Изменить</button><button class="btn" data-c9="archive" data-id="${esc(x.id)}">${x.archived?'Вернуть':'В архив'}</button></div><button class="btn c9-accent" data-c9="quick">Обновить статус</button>`:`<button class="btn" data-c9="close">Отмена</button><button class="btn c9-accent" data-c9="save">${ico('check',14)} Сохранить</button>`}</footer></section>`;document.body.appendChild(el);const app=document.getElementById('app');app.inert=true;app.setAttribute('aria-hidden','true');el.querySelector('.c9-panel-body').scrollTop=scroll;const first=el.querySelector(view?'[data-c9="close"]':ctx.mode==='update'?'#c9f-statusText':'#c9f-title');if(first)setTimeout(()=>{if(first.isConnected)first.focus({preventScroll:true});},0);}

/* Initiative timeline: date-only UTC arithmetic, no writes during viewing. */
const gantt = {scale:'fit',group:'stream',folded:new Set(),full:null,peek:null,left:0,top:0,includeToday:false,layout:null,focus:null};
const GANTT_DAY = 86400000;
function ganttDay(value){return value && c9ValidDate(value) ? Date.parse(value+'T00:00:00Z')/GANTT_DAY : NaN;}
function ganttISO(day){return new Date(day*GANTT_DAY).toISOString().slice(0,10);}
function ganttDate(day){return new Date(day*GANTT_DAY).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',timeZone:'UTC'});}
function ganttEligible(x){return !!x.startDate && !!x.deadline && c9ValidDate(x.startDate) && c9ValidDate(x.deadline) && x.startDate<=x.deadline;}
function ganttRows(){return gantt.full ? gantt.full.ids.map(c9ById).filter(Boolean) : c9Filtered();}
function ganttMissing(x){return !x.startDate&&!x.deadline?'Не заданы дата начала и срок реализации':!x.startDate?'Не задана дата начала':!x.deadline?'Не задан срок реализации':'Начало должно быть не позже окончания';}
function ganttLayout(rows){
 const today=ganttDay(c9Today()),valid=rows.filter(ganttEligible);let from=today-7,to=today+28;
 if(valid.length){from=Math.min(...valid.map(x=>ganttDay(x.startDate)));to=Math.max(...valid.map(x=>ganttDay(x.deadline)));if(gantt.includeToday){from=Math.min(from,today);to=Math.max(to,today);}from-=3;to+=3;}
 if(to-from<14)to=from+14;
 const host=document.querySelector(gantt.full?'#cbg-full .cbg-body':'#c9-results'),mobile=innerWidth<=760;
 const viewport=host?host.clientWidth:innerWidth-(mobile?32:290),label=mobile?140:300,days=to-from+1;
 const available=Math.max(130,viewport-label-2),unit=gantt.scale==='fit'?available/days:Math.min({days:34,weeks:12,months:4}[gantt.scale]||12,18000/days);
 const width=Math.max(available,days*unit),px=width/days,step=px>=25?1:px>=7?7:Math.max(14,Math.ceil(days/30));
 const ticks=[];for(let day=from;day<=to;day+=step)ticks.push({day,left:(day-from)*px,width:Math.min(step,to-day+1)*px});
 return gantt.layout={from,to,today,label,width,px,ticks};
}
function ganttGroups(rows){const groups=new Map();for(const x of rows){const key=gantt.group==='none'?'all':gantt.group==='owner'?(x.itOwnerId||'none'):(x.streamId||'none');if(!groups.has(key))groups.set(key,{key,name:gantt.group==='none'?'Все инициативы':gantt.group==='owner'?c9Person(x.itOwnerId):c9Stream(x.streamId),rows:[]});groups.get(key).rows.push(x);}return [...groups.values()];}
function ganttChart(rows,readonly){
 const l=ganttLayout(rows),todayLeft=(l.today-l.from+.5)*l.px;
 const today=l.today>=l.from&&l.today<=l.to?`<i class="cbg-today" style="left:${todayLeft}px" aria-hidden="true"></i>`:'';
 const line=()=>`<div class="cbg-track" style="--cbg-step:${Math.max(l.px,1)}px">${today}`;
 return `<div class="cbg-scroll" tabindex="0" role="region" aria-label="Диаграмма Ганта; прокручиваемая шкала времени"><div class="cbg-grid" style="--cbg-label:${l.label}px;--cbg-width:${l.width}px"><div class="cbg-row cbg-head"><div class="cbg-name"><b>Инициатива / ответственный</b><small>${readonly?'Только просмотр':'Нажми на полосу для подробностей'}</small></div><div class="cbg-axis"><b>${ganttDate(l.from)}.${new Date(l.from*GANTT_DAY).getUTCFullYear()} — ${ganttDate(l.to)}.${new Date(l.to*GANTT_DAY).getUTCFullYear()}</b>${l.ticks.map(t=>`<span style="left:${t.left}px;width:${t.width}px">${ganttDate(t.day)}</span>`).join('')}${today?`<em style="left:${todayLeft}px">Сегодня</em>`:''}</div></div>${ganttGroups(rows).map(g=>`${gantt.group==='none'?'':`<div class="cbg-row cbg-group"><div class="cbg-name"><button data-gantt="fold" data-key="${esc(g.key)}" aria-expanded="${!gantt.folded.has(g.key)}">${gantt.folded.has(g.key)?'›':'⌄'} ${esc(g.name)} <small>${g.rows.length}</small></button></div><div></div></div>`}${gantt.folded.has(g.key)?'':g.rows.map(x=>{
 const left=(ganttDay(x.startDate)-l.from)*l.px,width=Math.max(4,(ganttDay(x.deadline)-ganttDay(x.startDate)+1)*l.px);
 const description=x.title+' · '+c9Fmt(x.startDate,true)+' — '+c9Fmt(x.deadline,true)+' · '+C9_STATUS[x.status]+' · '+x.progress+'%';
 return `<div class="cbg-row cbg-task" data-gantt-row="${esc(x.id)}"><div class="cbg-name">${readonly?'':`<input type="checkbox" data-c9-select="${esc(x.id)}" aria-label="На встречу: ${esc(x.title)}" ${c9.selected.has(x.id)?'checked':''}>`}<div><button data-gantt="open" data-id="${esc(x.id)}">${esc(x.title)}</button><small>${esc(c9Person(x.itOwnerId))} · ${esc(x.priority)}</small><small>${esc(C9_STATUS[x.status])}${c9Late(x)?' · Просрочена':''}${x.demo?' · ДЕМО':''}</small></div></div>${line()}<button class="cbg-bar ${esc(x.status)}" data-gantt="open" data-id="${esc(x.id)}" style="left:${left}px;width:${width}px" title="${esc(description)}" aria-label="${esc(description)}"><i style="width:${x.progress}%"></i><span>${width>34?x.progress+'%':''}</span></button><small class="cbg-dates" style="left:${left}px">${ganttDate(ganttDay(x.startDate))} — ${ganttDate(ganttDay(x.deadline))}</small></div></div>`;
 }).join('')}`).join('')}${rows.length?'':`<div class="cbg-row cbg-task"><div class="cbg-name"><small>Периоды пока не заданы</small></div>${line()}</div></div>`}</div></div>`;
}
function ganttView(readonly){
 const rows=ganttRows(),valid=rows.filter(ganttEligible),missing=rows.filter(x=>!ganttEligible(x));
 return `<section class="cbg"><div class="cbg-heading"><div><h2>Диаграмма Ганта</h2><p>${valid.length} на шкале · ${missing.length} без периода · v0.10.1</p></div><small>Плановый период ≠ прогресс выполнения</small></div><div class="cbg-tools"><div>${[['fit','Вместить'],['days','Дни'],['weeks','Недели'],['months','Месяцы']].map(([k,t])=>`<button class="btn ${gantt.scale===k?'cbg-active':''}" data-gantt="scale" data-scale="${k}">${t}</button>`).join('')}</div><button class="btn" data-gantt="today">Сегодня</button><label>Группировать <select id="cbg-group">${c9Opt({stream:'По стримам',owner:'По ИТ-ответственным',none:'Без групп'},gantt.group)}</select></label>${readonly?'':`<label>Показать <select id="cbg-slice">${c9Opt({active:'Активные',all:'Все инициативы',attention:'Требуют внимания',upcoming:'Срок ≤ 14 дней',stale:'Давно не обновлялись',owner:'Без ответственного'},c9.metric)}</select></label><button class="btn" data-gantt="present">Презентация${c9.selected.size?' · '+c9.selected.size:''}</button>`}</div>${!valid.length?`<div class="cbg-notice"><b>Гант открыт — ${rows.length?'нужно задать периоды инициатив':'в выбранном срезе нет инициатив'}.</b><p>Для полосы нужны «Дата начала» и «Срок реализации». Дата создания не подставляется автоматически.</p>${readonly?'':`<button class="btn" data-c9="reset">Сбросить фильтры</button>${!data.initiatives.length?' <button class="btn" data-c9="demo">Добавить демопример</button>':''}`}</div>`:''}${rows.some(x=>x.demo)?'<p class="cbg-demo">ДЕМО · Учебные инициативы, не реальный план.</p>':''}${ganttChart(valid,readonly)}<p class="cbg-hint">↔ Прокручивай шкалу. Длина полосы — период, заливка — ручной прогресс. Даты просмотром не меняются.</p>${missing.length?`<details class="cbg-missing" ${!valid.length?'open':''}><summary>Без периода · ${missing.length}</summary>${missing.map(x=>`<div><span><b>${esc(x.title)}</b><small>${ganttMissing(x)}</small></span><button class="btn" data-gantt="${readonly?'open':'dates'}" data-id="${esc(x.id)}">${readonly?'Подробнее':'Задать даты'}</button></div>`).join('')}</details>`:''}${!readonly&&data.initiatives.some(x=>x.demo&&!x.startDate&&x.deadline)?'<button class="btn" data-gantt="demo-dates">Добавить даты только демопримерам</button>':''}</section>`;
}

paths.gantt='<path d="M3 3v18h18M7 6h8M10 11h11M7 16h6"/>';
const ganttResultsBase=c9Results,ganttShellBase=c9Shell,ganttPresentBase=c9StartPresentation;

function ganttRemember(){const el=document.querySelector(gantt.full?'#cbg-full .cbg-scroll':'#c9-results .cbg-scroll');if(el){gantt.left=el.scrollLeft;gantt.top=el.scrollTop;}}

function ganttRefresh(){if(gantt.full){const el=document.querySelector('#cbg-full .cbg-body');if(el)el.innerHTML=ganttView(true);}else ganttRefreshBase();ganttRestore();}
const ganttRefreshBase=c9Refresh,ganttSelectionBase=c9SelectRefresh;
c9Refresh=function(){if(c9.page==='gantt')ganttRemember();ganttRefreshBase();if(c9.page==='gantt')ganttRestore();};

function ganttPresent(){
 if(!c9Discard())return;
 const selected=[...c9.selected].map(c9ById).filter(Boolean),prior=c9.presentation;
 const rows=prior?prior.ids.map(c9ById).filter(Boolean):selected.length?selected:c9Filtered();
 ganttRemember();gantt.focus=document.activeElement;gantt.full={ids:rows.map(x=>x.id),prior,left:gantt.left,top:gantt.top};gantt.left=0;gantt.top=0;c9.presentation=null;
 const el=document.createElement('section');el.id='cbg-full';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Гант: презентация');
 el.innerHTML='<header><div><b>Инициативы · Диаграмма Ганта</b><small>'+esc(data.current.cluster.name)+' · Только просмотр · v0.10.1</small></div><div class="c9-actions"><button class="btn" data-gantt="fullscreen">Полный экран</button><button class="btn" data-gantt="exit">Выйти</button></div></header><main class="cbg-body"></main>';
 document.body.appendChild(el);document.querySelector('#app').inert=true;document.querySelector('#app').setAttribute('aria-hidden','true');ganttRefresh();el.querySelector('[data-gantt="exit"]').focus();

function ganttExit(){const state=gantt.full;if(!state)return;document.querySelector('#cbg-full').remove();gantt.full=null;gantt.peek=null;gantt.left=state.left;gantt.top=state.top;c9.presentation=state.prior;const app=document.querySelector('#app');app.inert=false;app.removeAttribute('aria-hidden');if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});render();ganttRestore();if(gantt.focus&&gantt.focus.isConnected)gantt.focus.focus();}
function ganttPeek(id){const x=c9ById(id);if(!x)return;const old=document.querySelector('#cbg-peek');if(old)old.remove();const el=document.createElement('div');el.id='cbg-peek';el.innerHTML='<section role="dialog" aria-modal="true" aria-label="Инициатива: только просмотр"><button class="btn" data-gantt="back">Назад</button>'+c9Detail(x)+'</section>';document.querySelector('#cbg-full').appendChild(el);gantt.peek=id;el.querySelector('button').focus();}

window.addEventListener('click',function(e){const b=e.target.closest('[data-gantt]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const action=b.dataset.gantt;
 if(action==='present')return ganttPresent();if(action==='exit')return ganttExit();if(action==='back')return ganttBack();
 if(action==='open'){if(gantt.full)return ganttPeek(b.dataset.id);return c9Open(b.dataset.id,'view');}

 if(action==='today'){gantt.includeToday=true;ganttRefresh();const el=document.querySelector(gantt.full?'#cbg-full .cbg-scroll':'#c9-results .cbg-scroll'),l=gantt.layout;if(el&&l){el.scrollLeft=(l.today-l.from)*l.px-(el.clientWidth-l.label)/2;ganttRemember();}return;}
},true);
